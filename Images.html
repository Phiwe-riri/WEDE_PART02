<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clothing Gallery | Forever Cool Fashion Collection</title>

    <meta name="description"
          content="Explore the Forever Cool clothing gallery featuring fashion items, stylish clothing and accessories from our collection.">

    <meta name="keywords"
          content="Forever Cool, clothing gallery, fashion collection, clothing styles, fashion accessories">

    <meta name="robots" content="index, follow">

    <style>
        body {
            margin: 0;
            background-color: #fff;
            color: #222;
            font-family: Georgia, serif;
        }

        header {
            background-color: #222;
            padding: 25px;
            display: flex;
            align-items: center;
        }

        header img {
            width: 75px;
            height: 85px;
            border: 3px solid #887355;
            margin-right: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 18px;
            font-size: 17px;
        }

        nav a:hover {
            color: #887355;
        }

        main {
            text-align: center;
            padding: 60px 30px;
        }

        h1 {
            font-size: 55px;
            margin: 0;
        }

        p {
            font-size: 20px;
            margin-top: 20px;
        }

        h2 {
            font-size: 35px;
            margin-top: 55px;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .gallery img {
            width: 220px;
            height: 190px;
            object-fit: cover;
            cursor: pointer;
        }

        /* Image popup */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        #imageModal.open {
            display: block;
        }

        #modalImage {
            max-width: 85%;
            max-height: 80%;
            margin-top: 5%;
            object-fit: contain;
        }

        #closeModal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        footer {
            background-color: #222;
            color: bisque;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            header img {
                margin-right: 0;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="Images/Logo.PNG"
             alt="Forever Cool clothing brand logo">

        <nav>
            <a href="Home.html">Home Page</a>
            <a href="About us.html">About Us</a>
            <a href="Products and Services.html">Products and Services</a>
            <a href="Images.html">Images</a>
            <a href="News.html">News and Updates</a>
            <a href="Contact.html">Contact Us</a>
            <a href="enquiry.html">Product Enquiry</a>
        </nav>
    </header>

    <main>
        <h1>OUR GALLERY</h1>

        <p>Explore the Forever Cool clothing collection.</p>

        <h2>FEATURED COLLECTION</h2>

        <div class="gallery">
            <img src="Images/A.jpg" alt="Forever Cool clothing item">
            <img src="Images/B.jpg" alt="Fashion clothing from Forever Cool">
            <img src="Images/C.jpg" alt="Forever Cool clothing collection">
            <img src="Images/D.jpg" alt="Fashion item from Forever Cool">
            <img src="Images/E.jpg" alt="Forever Cool cap">
        </div>

        <!-- Image popup: leave this section below the gallery -->
        <div id="imageModal">
            <span id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Enlarged Forever Cool gallery image">
        </div>

    </main>

    <footer>
        &copy; 2026 Forever Cool Clothing Brand
    </footer>

    <!-- Connect the JavaScript file -->
    <script src="JavaScript/script.js"></script>

</body>
</html>
